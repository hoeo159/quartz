name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  # Sent by hoeo159/quartz-content whenever notes are pushed there.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info

      # `content` is git-ignored here: locally it is a symlink to the Obsidian
      # vault on the Windows drive. On CI it is the vault repository itself.
      - name: Check out content
        uses: actions/checkout@v6
        with:
          repository: hoeo159/quartz-content
          path: content
          fetch-depth: 0 # Fetch all history so git modified dates are accurate

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Build Quartz
        run: npm run site:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
